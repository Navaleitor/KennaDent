# Pruebas automáticas en cada pull request (y en main). Nada se une si algo falla.
# Corre en los servidores de GitHub: no usa tu computadora.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tipos, estilo, Vitest y compilación)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Revisión de tipos, ESLint y Prettier
        run: npm run revisar
      - name: Pruebas (Vitest)
        run: npm test
      - name: Compilar para producción
        run: npm run build

  api:
    name: API (pruebas de Django y tipos al día)
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: kennadent_qa
          POSTGRES_USER: kennadent
          POSTGRES_PASSWORD: solo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kennadent -d kennadent_qa"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      KD_DEBUG: "1"
      KD_SECRET_KEY: solo-para-las-pruebas-de-ci
      KD_DB_HOST: localhost
      KD_DB_PUERTO: "5432"
      KD_DB_NOMBRE: kennadent_qa
      KD_DB_ADMIN: kennadent
      KD_DB_ADMIN_PASSWORD: solo_ci
      KD_DB_APP: kd_app
      KD_APP_PASSWORD: solo_ci_app
      KD_DB_ROL: admin
      TZ: America/Monterrey
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Usuario kd_app (igual que infra/local/db/10_usuario_app.sh)
        env:
          PGPASSWORD: solo_ci
        run: psql -h localhost -U kennadent -d kennadent_qa -v ON_ERROR_STOP=1 -c "CREATE ROLE kd_app LOGIN PASSWORD 'solo_ci_app'"
      - name: Pruebas de la API
        working-directory: backend
        run: python manage.py test nucleo --noinput
      - name: Esquema OpenAPI sin advertencias
        working-directory: backend
        run: python manage.py spectacular --validate --fail-on-warn --format openapi-json --file ../frontend/openapi/esquema.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Los tipos del frontend están al día con la API
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run tipos
          if ! git diff --exit-code -- openapi src/api/esquema.d.ts; then
            echo "::error::La API cambió y no se regeneraron los tipos. Corre los comandos de docs/entorno-local.md (Tipos de la API) y sube los archivos."
            exit 1
          fi

  pantallas:
    name: Pantallas (Playwright con el entorno de Docker)
    runs-on: ubuntu-24.04
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Variables del entorno (las de ejemplo; solo datos ficticios)
        run: cp .env.example .env
      - name: Levantar el entorno
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Pruebas de pantallas
        run: docker compose run --rm -e CI=1 pruebas-pantallas
      - name: Mensajes del backend si algo falló
        if: failure()
        run: docker compose logs api frontend web --tail 200
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
