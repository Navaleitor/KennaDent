# Un solo origen (http://localhost:8080) para el frontend y la API: asi la
# cookie de sesion y la proteccion CSRF funcionan sin configuracion extra.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Prototipo (archivos estaticos)
    root /usr/share/nginx/html;
    index index.html;

    # Backend Django: API, admin de plataforma y sus archivos estaticos
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
