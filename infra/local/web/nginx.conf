# Un solo origen (http://localhost:8080) para el frontend y la API: asi la
# cookie de sesion y la proteccion CSRF funcionan sin configuracion extra.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Prototipo (archivos estaticos)
    root /usr/share/nginx/html;
    index index.html;

    # Frontend nuevo (React, docs/frontend.md): Vite en el contenedor "frontend".
    # Con "resolver" nginx arranca aunque el frontend todavia no este listo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        set $frontend http://frontend:5173;
        proxy_pass $frontend;
        # Recarga en vivo (websocket de Vite)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Backend Django: API, admin de plataforma y sus archivos estaticos
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
