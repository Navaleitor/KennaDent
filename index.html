<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KennaDent · Gestión dental</title>
  <meta name="description" content="KennaDent: sistema de gestión para clínicas dentales con múltiples sucursales.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { var t = localStorage.getItem("kennadent-tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <aside class="sidebar" aria-label="Menú principal">
    <div class="marca">
      <img src="assets/logo.svg" alt="" width="30" height="30">
      <div>
        <strong>KennaDent</strong>
        <small id="empresa-nombre"></small>
      </div>
    </div>
    <nav id="nav"></nav>
    <p class="sidebar-pie">Prototipo · Fase 1</p>
  </aside>
  <div class="velo" id="velo"></div>

  <div class="principal">
    <header class="barra">
      <button class="btn-icon solo-movil" id="btn-menu" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="barra-acciones" id="barra-acciones"></div>
    </header>
    <main id="contenido" tabindex="-1"></main>
  </div>

  <script src="js/roles.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/metricas.js"></script>
  <script src="js/views/panel.js"></script>
  <script src="js/views/agenda.js"></script>
  <script src="js/views/pacientes.js"></script>
  <script src="js/views/expediente.js"></script>
  <script src="js/views/presupuestos.js"></script>
  <script src="js/views/estadisticas.js"></script>
  <script src="js/views/personal.js"></script>
  <script src="js/views/empresa.js"></script>
  <script src="js/app.js"></script>

</html>
